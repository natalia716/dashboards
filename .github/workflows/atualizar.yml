# Atualiza todos os dashboards a cada 15 minutos e publica no GitHub Pages
# (dash.atodigital.com.br/<cliente>).
#
# Segredo necessário (Settings → Secrets and variables → Actions → New repository secret):
#   META_TOKEN            token de sistema do Meta (ads_read, read_insights)
#   META_TOKEN_<CLIENTE>  opcional — token específico, se um cliente estiver em outro Business Manager
#                         (ex.: META_TOKEN_OMUNDOCLINICO)
#
# Em Settings → Pages, "Source" precisa estar em "GitHub Actions".

name: Atualizar dashboards

on:
  schedule:
    # a cada 15 min, em minutos deslocados: :00/:15/:30/:45 são os mais disputados do GitHub
    # e os agendamentos neles atrasam ou são pulados com frequência
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:         # botão "Run workflow" para rodar na mão
  push:
    branches: [main]         # qualquer mudança no código republica na hora

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletar dados de cada cliente (Meta Ads + planilha)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TOKEN_OMUNDOCLINICO: ${{ secrets.META_TOKEN_OMUNDOCLINICO }}
        run: |
          set -e
          for dir in clientes/*/; do
            cliente=$(basename "$dir")
            node refresh.js "$cliente"
          done

      - name: Montar o site (sem colunas de contato)
        run: node build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
