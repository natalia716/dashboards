# Atualiza todos os dashboards a cada 15 minutos e publica no GitHub Pages
# (dash.atodigital.com.br/<cliente>).
#
# Segredo necessário (Settings → Secrets and variables → Actions → New repository secret):
#   META_TOKEN            token de sistema do Meta (ads_read, read_insights)
#   META_TOKEN_<CLIENTE>  opcional — token específico, se um cliente estiver em outro Business Manager
#                         (ex.: META_TOKEN_OMUNDOCLINICO)
#   HOTMART_CLIENT_ID_<CLIENTE>, HOTMART_CLIENT_SECRET_<CLIENTE>, HOTMART_BASIC_<CLIENTE>
#                         clientes de criativos: credencial da API da Hotmart (Ferramentas → Credenciais Developers)
#   META_TOKEN_ACT_<NÚMERO DA CONTA>  opcional — token de uma conta de anúncio específica (outro Business Manager)
#   PAYT_READ_KEY_<CLIENTE>  clientes de criativos com Payt: chave de leitura do receptor de postback (payt/worker.js)
#
# Em Settings → Pages, "Source" precisa estar em "GitHub Actions".

name: Atualizar dashboards

on:
  schedule:
    # a cada 15 min, em minutos deslocados: :00/:15/:30/:45 são os mais disputados do GitHub
    # e os agendamentos neles atrasam ou são pulados com frequência
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:         # botão "Run workflow" para rodar na mão
  push:
    branches: [main]         # qualquer mudança no código republica na hora

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Clientes do tipo "criativos" guardam o histórico do Meta em clientes/<cliente>/out/cache e só buscam os
      # últimos dias a cada execução (o histórico inteiro a cada 15 min estoura o limite de chamadas da conta).
      # Só esse diretório vai para o cache: métricas do Meta, miniaturas e vendas sem dado do comprador (código,
      # data, anúncio, valor, produto) — nada de leads ou compradores: o repositório é público e workflows de PR
      # conseguem ler caches da main.
      - name: Restaurar cache do Meta (clientes de criativos)
        uses: actions/cache/restore@v4
        with:
          path: clientes/*/out/cache
          key: meta-cache-${{ github.run_id }}
          restore-keys: meta-cache-

      - name: Coletar dados de cada cliente (Meta Ads + planilha)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TOKEN_OMUNDOCLINICO: ${{ secrets.META_TOKEN_OMUNDOCLINICO }}
          HOTMART_CLIENT_ID_GLAUBORGES: ${{ secrets.HOTMART_CLIENT_ID_GLAUBORGES }}
          HOTMART_CLIENT_SECRET_GLAUBORGES: ${{ secrets.HOTMART_CLIENT_SECRET_GLAUBORGES }}
          HOTMART_BASIC_GLAUBORGES: ${{ secrets.HOTMART_BASIC_GLAUBORGES }}
          HOTMART_CLIENT_ID_GHENADY: ${{ secrets.HOTMART_CLIENT_ID_GHENADY }}
          HOTMART_CLIENT_SECRET_GHENADY: ${{ secrets.HOTMART_CLIENT_SECRET_GHENADY }}
          HOTMART_BASIC_GHENADY: ${{ secrets.HOTMART_BASIC_GHENADY }}
          META_TOKEN_ACT_538876983472217: ${{ secrets.META_TOKEN_ACT_538876983472217 }}
          PAYT_READ_KEY_CHEFBERNADETE: ${{ secrets.PAYT_READ_KEY_CHEFBERNADETE }}
        run: |
          # Um cliente que falha (API fora do ar, planilha trocada, token expirado) não pode
          # derrubar a publicação dos outros: o erro é registrado e o build segue com os dados
          # que esse cliente já tinha. Se nenhum cliente coletar, aí sim a execução falha.
          ok=0; falhou=""
          for dir in clientes/*/; do
            cliente=$(basename "$dir")
            if node refresh.js "$cliente"; then
              ok=$((ok+1))
            else
              falhou="$falhou $cliente"
              echo "::warning title=Coleta falhou::$cliente não coletou nesta execução"
            fi
          done
          if [ -n "$falhou" ]; then echo "clientes com falha:$falhou"; fi
          [ "$ok" -gt 0 ] || { echo "::error::nenhum cliente coletou"; exit 1; }

      - name: Salvar cache do Meta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: clientes/*/out/cache
          key: meta-cache-${{ github.run_id }}

      - name: Montar o site (sem colunas de contato)
        run: node build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # O deploy do Pages falha de forma intermitente (chega a 60% das execuções em alguns dias).
      # A primeira tentativa não derruba o run; se ela falhar, espera e tenta de novo.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de tentar o deploy de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Resultado do deploy
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "publicado na primeira tentativa"
          elif [ "${{ steps.deploy2.outcome }}" = "success" ]; then
            echo "::warning title=Deploy instável::publicado só na segunda tentativa"
          else
            echo "::error::as duas tentativas de deploy falharam"; exit 1
          fi
