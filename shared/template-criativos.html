<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ATO · {{NOME}}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ============ ATO · performance dos criativos — mesmo visual do painel de lançamento ============ */
  :root {
    color-scheme: light;
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #f6f7f9;
    --hover: #eef1f5;
    --line: #e6e9ef;
    --line-strong: #d5dae2;
    --ink: #081f2d;           /* azul petróleo da marca */
    --ink-2: #4b5b69;
    --muted: #8a97a5;
    --accent: #ff6b00;        /* laranja da marca */
    --accent-strong: #e86000;
    --accent-soft: rgba(255, 107, 0, .10);
    --logo: #081f2d;
    --dot: #ff6b00;
    --good: #1d9e5f;
    --good-soft: rgba(29, 158, 95, .10);
    --bad: #d93a3a;
    --bad-soft: rgba(217, 58, 58, .09);
    --shadow: 0 1px 2px rgba(8, 31, 45, .06), 0 1px 3px rgba(8, 31, 45, .04);
    --pop-shadow: 0 12px 32px rgba(8, 31, 45, .16);
    --radius: 10px;
    --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent-strong); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---------- barra superior ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); box-shadow: var(--shadow); }
  .top-inner { max-width: 1400px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 16px; margin-right: auto; }
  .brand svg { height: 30px; width: auto; display: block; }
  .brand svg .lg { fill: var(--logo); }
  .brand svg .dt { fill: var(--dot); }
  .brand h1 { font-size: 17px; color: var(--ink); }
  .brand h1 span { color: var(--muted); font-weight: 500; }

  /* ---- período (menu suspenso: presets + calendário) — o mesmo dos outros painéis ---- */
  .periodWrap { position: relative; }
  .periodBtn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 12px; min-height: 38px; font-size: 13.5px; cursor: pointer;
  }
  .periodBtn:hover { border-color: var(--accent); }
  .periodBtn svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
  .periodBtn .periodRange { color: var(--muted); font-variant-numeric: tabular-nums; }
  .periodBtn .chev { margin-left: auto; transition: transform .15s; }
  .periodBtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .periodPop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--pop-shadow); overflow: hidden; }
  .periodPresets { display: flex; flex-direction: column; padding: 6px; border-right: 1px solid var(--line); min-width: 176px; }
  .periodPresets button { text-align: left; background: none; border: none; color: var(--ink-2); font-size: 13.5px; padding: 8px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .periodPresets button:hover { background: var(--hover); color: var(--ink); }
  .periodPresets button.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .periodCal { padding: 10px 12px 10px; width: 280px; }
  .calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .calHead span { font-size: 13px; font-weight: 600; color: var(--ink); }
  .calHead button { background: none; border: 1px solid transparent; color: var(--ink-2); font-size: 18px; line-height: 1; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; }
  .calHead button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .calHead button:disabled { opacity: .3; cursor: default; }
  .calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-variant-numeric: tabular-nums; }
  .calGrid .wd { text-align: center; font-size: 10.5px; color: var(--muted); padding: 2px 0 4px; letter-spacing: .04em; }
  .calGrid .d { height: 30px; border: none; background: none; color: var(--ink); font-size: 12.5px; border-radius: 6px; cursor: pointer; padding: 0; }
  .calGrid .d:hover { background: var(--hover); }
  .calGrid .d.out { color: var(--muted); opacity: .6; }
  .calGrid .d:disabled { color: var(--muted); opacity: .35; cursor: default; background: none; }
  .calGrid .d.in { background: var(--accent-soft); border-radius: 0; }
  .calGrid .d.from, .calGrid .d.to { background: var(--accent); color: #fff; font-weight: 600; }
  .calGrid .d.from { border-radius: 6px 0 0 6px; }
  .calGrid .d.to { border-radius: 0 6px 6px 0; }
  .calGrid .d.from.to { border-radius: 6px; }
  .calFoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .calFoot .hint { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .calGrid .d.today { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .salesNote { flex-basis: 100%; margin: -4px 0 0; color: var(--muted); font-size: 12.5px; }
  .btnPrimary { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btnPrimary:hover { background: var(--accent-strong); }
  .btnPrimary:disabled { opacity: .4; cursor: default; }

  /* ---------- página ---------- */
  .page { max-width: 1400px; margin: 0 auto; padding-block: 20px 48px; padding-inline: 24px; display: grid; gap: 18px; }
  .page > * { min-width: 0; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 18px 22px 0; flex-wrap: wrap; }
  .card-head h2 { font-size: 16px; }
  .card-head .count { color: var(--muted); font-size: 13px; }
  .card-head .right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---------- controles ---------- */
  .search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; min-height: 36px; background: var(--surface); }
  .search:focus-within { border-color: var(--accent); }
  .search svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
  .search input { border: none; outline: none; background: none; min-width: 0; width: 170px; font-size: 13px; }
  .sel { border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; min-height: 36px; background: var(--surface); font-size: 13px; cursor: pointer; }
  .sel:hover { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: var(--surface); padding: 0 12px; min-height: 34px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }

  /* ---------- cards de criativo ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding: 16px 22px 22px; }
  .ad { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; background: var(--surface); }
  .ad:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .thumb { position: relative; display: block; width: 100%; aspect-ratio: 1; padding: 0; border: none; background: var(--surface-2); cursor: pointer; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
  .thumb:hover img { transform: scale(1.03); }
  .thumb .rank { position: absolute; top: 10px; left: 10px; background: rgba(8, 31, 45, .82); color: #fff; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
  .thumb .kind { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, .92); color: var(--ink); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; border-radius: 5px; padding: 3px 7px; }
  .thumb .play { position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; border-radius: 50%; background: rgba(8, 31, 45, .55); display: grid; place-items: center; opacity: .9; }
  .thumb .play svg { width: 18px; height: 18px; fill: #fff; margin-left: 3px; }
  .thumb .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .ad-body { padding: 12px 14px 14px; display: grid; gap: 12px; }
  .ad-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .ad-title strong { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; line-height: 1.3; }
  .plink { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; text-decoration: none; border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 8px; color: var(--ink-2); background: var(--surface); white-space: nowrap; flex: none; }
  .plink:hover { border-color: var(--accent); color: var(--accent-strong); }
  .plink svg { width: 12px; height: 12px; }
  .mets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  .met .l { font-size: 11px; color: var(--muted); }
  .met .v { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .met .v.good { color: var(--good); }
  .met .v.bad { color: var(--bad); }
  .sec { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--muted); }
  .sec b { color: var(--ink-2); font-weight: 600; }

  /* ---------- tabela ---------- */
  .tbl-wrap { overflow-x: auto; padding: 8px 6px 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1220px; }
  th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--surface); position: sticky; top: 0; }
  th:first-child, td:first-child { text-align: left; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th[data-dir]::after { content: " ↓"; color: var(--accent); }
  th[data-dir="asc"]::after { content: " ↑"; }
  tbody tr:hover { background: var(--surface-2); }
  tfoot td { font-weight: 600; background: var(--surface-2); border-bottom: 0; color: var(--ink); }
  td.good { color: var(--good); font-weight: 600; }
  td.bad { color: var(--bad); font-weight: 600; }
  td:first-child { min-width: 300px; }
  .creative { display: flex; align-items: center; gap: 12px; }
  .creative .mini { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); flex: none; padding: 0; cursor: pointer; overflow: hidden; }
  .creative .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .creative .nm { display: grid; gap: 3px; min-width: 0; }
  .creative .nm strong { font-weight: 500; white-space: normal; overflow-wrap: anywhere; max-width: 280px; color: var(--ink); }
  .empty { padding: 36px; text-align: center; color: var(--muted); }

  /* ---------- prévia (modal) ---------- */
  dialog { border: none; border-radius: 12px; padding: 0; box-shadow: var(--pop-shadow); width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(8, 31, 45, .55); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .dlg-head strong { font-size: 13.5px; overflow-wrap: anywhere; margin-right: auto; }
  .dlg-close { border: none; background: none; width: 32px; height: 32px; border-radius: 6px; font-size: 20px; line-height: 1; color: var(--ink-2); cursor: pointer; flex: none; }
  .dlg-close:hover { background: var(--hover); color: var(--ink); }
  .dlg-body { overflow: auto; max-height: calc(100dvh - 100px); }
  .dlg-body iframe { display: block; width: 100%; height: 640px; border: 0; }
  .dlg-body img { display: block; width: 100%; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 28px; }

  @media (max-width: 640px) {
    .top-inner { padding: 10px 16px; gap: 10px; }
    .brand h1 { font-size: 15px; }
    .periodWrap, .periodBtn { width: 100%; min-width: 0; }
    .periodPop { left: 0; right: auto; flex-direction: column; max-width: 100%; }
    .periodPresets { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; }
    .periodCal { width: 100%; max-width: 300px; }
    .page { padding-inline: 16px; gap: 14px; }
    .card-head { padding: 16px 16px 0; }
    .card-head .right { margin-left: 0; width: 100%; }
    .search { flex: 1; }
    .search input { width: 100%; }
    .grid { padding: 14px 16px 16px; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 690.38 285.96" role="img" aria-label="ATO">
        <path class="lg" d="M232.59,65.19v174.46h-19.32V85.12L68.9,229.48l-13.66-13.66L196.74,74.31H43.64v-19.32h178.75c5.63,0,10.2,4.57,10.2,10.2Z"/>
        <path class="lg" d="M417.96,60.42v13.89h-65.13v165.33h-19.32V74.31h-63.7v-13.89c0-3,2.43-5.43,5.43-5.43h137.29c3,0,5.43,2.43,5.43,5.43Z"/>
        <path class="lg" d="M584.86,74.31c-14.11-11.01-31.47-18.01-50.41-19.32-2.16-.16-4.34-.23-6.54-.23s-4.38.07-6.54.23c-18.94,1.32-36.31,8.32-50.41,19.32-21.76,16.96-35.75,43.42-35.75,73.15,0,47.92,36.35,87.33,82.99,92.19h19.44c46.63-4.86,82.98-44.27,82.98-92.19,0-29.72-13.99-56.19-35.74-73.15ZM527.9,222.71c-41.56,0-75.25-33.69-75.25-75.25,0-35.46,24.52-65.18,57.52-73.15,5.68-1.37,11.62-2.1,17.73-2.1s12.04.73,17.72,2.1c33,7.96,57.52,37.68,57.52,73.15,0,41.55-33.69,75.25-75.24,75.25Z"/>
        <circle class="dt" cx="641.65" cy="222.3" r="17.35"/>
      </svg>
      <h1>Performance dos anúncios <span>-</span> {{NOME}}</h1>
    </div>
    <div class="periodWrap">
      <button class="periodBtn" id="periodBtn" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span id="periodLabel">Período completo</span>
        <span class="periodRange" id="periodRange"></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="periodPop" id="periodPop" role="dialog" aria-label="Selecionar período" hidden>
        <div class="periodPresets" id="periodPresets">
          <button data-p="max">Período completo</button>
          <button data-p="today">Hoje</button>
          <button data-p="7">Últimos 7 dias</button>
          <button data-p="14">Últimos 14 dias</button>
          <button data-p="30">Últimos 30 dias</button>
          <button data-p="custom">Personalizado</button>
        </div>
        <div class="periodCal">
          <div class="calHead">
            <button id="calPrev" aria-label="Mês anterior">‹</button>
            <span id="calTitle"></span>
            <button id="calNext" aria-label="Próximo mês">›</button>
          </div>
          <div class="calGrid" id="calGrid"></div>
          <div class="calFoot">
            <span class="hint" id="calSel"></span>
            <button class="btnPrimary" id="calApply" disabled>Aplicar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="page">

  <section class="card" aria-labelledby="h-ads">
    <div class="card-head">
      <h2 id="h-ads">Performance por criativo</h2>
      <span class="count" id="count"></span>
      <p class="salesNote" id="salesNote" hidden></p>
      <div class="right">
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Buscar criativo" aria-label="Buscar criativo">
        </label>
        <select class="sel" id="sort" aria-label="Ordenar por">
          <option value="sales">Mais vendas</option>
          <option value="profit">Maior lucro</option>
          <option value="roas">Maior ROAS</option>
          <option value="spend">Maior investimento</option>
          <option value="revenue">Maior faturamento</option>
          <option value="cpa">Menor CPA</option>
          <option value="ctr">Maior CTR</option>
          <option value="cpc">Menor CPC</option>
          <option value="cpm">Menor CPM</option>
          <option value="cpi">Menor CPI</option>
        </select>
        <div class="seg" role="group" aria-label="Visualização">
          <button data-view="cards" aria-pressed="true">Cards</button>
          <button data-view="table" aria-pressed="false">Tabela</button>
        </div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="tbl-wrap" id="tblWrap" hidden>
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
    <div class="empty" id="empty" hidden>Nenhum criativo encontrado.</div>
  </section>
</main>

<footer id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <strong id="dlgTitle"></strong>
    <a class="plink" id="dlgLink" target="_blank" rel="noopener"></a>
    <button class="dlg-close" id="dlgClose" aria-label="Fechar">×</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
const D = /*__DATA__*/{};
(function () {
  'use strict';

  // ---------- formatação ----------
  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const BRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const INT = new Intl.NumberFormat('pt-BR');
  const ok = v => v != null && isFinite(v);
  const fmtMoney = v => ok(v) ? BRL.format(v) : '—';
  const fmtMoney0 = v => ok(v) ? BRL0.format(v) : '—';
  const fmtInt = v => ok(v) ? INT.format(Math.round(v)) : '—';
  const fmtPct = v => ok(v) ? (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%' : '—';
  const fmtX = v => ok(v) ? v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tone = (v, zero = 0) => !ok(v) ? '' : v > zero ? 'good' : v < zero ? 'bad' : '';

  const ROWS = (D.daily && D.daily.rows) || [];
  const AD_META = new Map((D.ads || []).map(a => [a.name, a]));

  // ---------- métricas derivadas de somas ----------
  function derive(t) {
    return {
      ...t,
      profit: t.revenue - t.spend,
      cpa: t.sales > 0 ? t.spend / t.sales : null,
      roas: t.spend > 0 ? t.revenue / t.spend : null,
      cpm: t.impressions > 0 ? t.spend / t.impressions * 1000 : null,
      ctr: t.impressions > 0 ? t.clicks / t.impressions : null,
      cpc: t.clicks > 0 ? t.spend / t.clicks : null,
      cpi: t.checkouts > 0 ? t.spend / t.checkouts : null, // custo por finalização de compra iniciada
    };
  }
  const zero = () => ({ sales: 0, spend: 0, revenue: 0, impressions: 0, clicks: 0, checkouts: 0 });
  const add = (a, b) => { for (const k of ['sales', 'spend', 'revenue', 'impressions', 'clicks', 'checkouts']) a[k] += b[k] || 0; return a; };

  // ---------- estado ----------
  const state = { sort: 'sales', dir: null, view: 'cards', q: '' };
  try {
    const v = localStorage.getItem('ato-criativos-view');
    if (v === 'cards' || v === 'table') state.view = v;
  } catch (e) { /* sem storage: fica o padrão */ }

  // ---------- período (menu suspenso com presets + calendário, como nos outros painéis) ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y.slice(2)}`; };
  const fmtRange = (a, b) => a === b ? fmtDate(a) : `${fmtDate(a)} – ${fmtDate(b)}`;
  const SINCE = (D.summary && D.summary.since) || (ROWS[0] && ROWS[0][0]);
  const UNTIL = (D.summary && D.summary.until) || (ROWS.length && ROWS[ROWS.length - 1][0]);
  const SALES_UNTIL = D.summary && D.summary.vendasAte;
  const PRESET_LABEL = { max: 'Período completo', today: 'Hoje', 7: 'Últimos 7 dias', 14: 'Últimos 14 dias', 30: 'Últimos 30 dias', custom: 'Personalizado' };
  state.preset = 'max';

  function applyPreset() {
    const p = state.preset, U = UNTIL;
    if (p === 'max') { state.from = SINCE; state.to = U; }
    else if (p === 'today') { state.from = U; state.to = U; }
    else if (p === '7' || p === '14' || p === '30') { state.to = U; state.from = addDays(U, -(+p - 1)); }
    if (state.from < SINCE) state.from = SINCE;
    // custom: mantém o que foi escolhido no calendário
  }
  function updatePeriodButton() {
    $('periodLabel').textContent = PRESET_LABEL[state.preset] || 'Período';
    $('periodRange').textContent = state.from ? fmtRange(state.from, state.to) : '';
    // vendas vêm do export da Hotmart: avisa quando o período passa da última importação
    const stale = SALES_UNTIL && state.to > SALES_UNTIL;
    $('salesNote').hidden = !stale;
    if (stale) $('salesNote').textContent = `Vendas da Hotmart importadas até ${fmtDate(SALES_UNTIL)}: os dias seguintes ainda aparecem sem venda.`;
  }

  const cal = { y: 0, m: 0 };            // mês exibido
  const pick = { from: null, to: null };  // seleção em andamento no calendário
  function openPeriod() {
    pick.from = null; pick.to = null;
    const [y, m] = state.to.split('-').map(Number);
    cal.y = y; cal.m = m - 1;
    for (const b of $('periodPresets').children) b.classList.toggle('on', b.dataset.p === state.preset);
    renderCal();
    $('periodPop').hidden = false;
    $('periodBtn').setAttribute('aria-expanded', 'true');
  }
  function closePeriod() {
    $('periodPop').hidden = true;
    $('periodBtn').setAttribute('aria-expanded', 'false');
  }
  function renderCal() {
    const first = new Date(Date.UTC(cal.y, cal.m, 1));
    const title = first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    $('calTitle').textContent = title.charAt(0).toUpperCase() + title.slice(1);
    const shown = `${cal.y}-${pad(cal.m + 1)}`;
    $('calPrev').disabled = shown <= SINCE.slice(0, 7);
    $('calNext').disabled = shown >= UNTIL.slice(0, 7);
    // intervalo destacado: a seleção em andamento ou, sem ela, o período atual
    const a = pick.from || state.from, b = pick.to || (pick.from ? pick.from : state.to);
    const lo = a < b ? a : b, hi = a < b ? b : a;
    let html = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(w => `<span class="wd">${w}</span>`).join('');
    const startDow = first.getUTCDay();
    const daysIn = new Date(Date.UTC(cal.y, cal.m + 1, 0)).getUTCDate();
    const prevDays = new Date(Date.UTC(cal.y, cal.m, 0)).getUTCDate();
    const cells = [];
    for (let i = startDow - 1; i >= 0; i--) cells.push({ d: prevDays - i, off: -1 });
    for (let d = 1; d <= daysIn; d++) cells.push({ d, off: 0 });
    while (cells.length % 7) cells.push({ d: cells.length - startDow - daysIn + 1, off: 1 });
    for (const c of cells) {
      const dt = new Date(Date.UTC(cal.y, cal.m + c.off, c.d));
      const key = `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
      const cls = ['d'];
      if (c.off) cls.push('out');
      if (key === UNTIL) cls.push('today');
      if (key === lo) cls.push('from');
      if (key === hi) cls.push('to');
      if (key > lo && key < hi) cls.push('in');
      html += `<button type="button" class="${cls.join(' ')}" data-d="${key}"${key > UNTIL || key < SINCE ? ' disabled' : ''}>${c.d}</button>`;
    }
    $('calGrid').innerHTML = html;
    const ready = pick.from !== null;
    $('calSel').textContent = ready ? fmtRange(lo, hi) : 'Clique no início e no fim';
    $('calApply').disabled = !ready;
  }
  function initPeriodPicker() {
    $('periodBtn').addEventListener('click', () => { $('periodPop').hidden ? openPeriod() : closePeriod(); });
    $('periodPresets').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.p === 'custom') { // só muda o foco para o calendário
        for (const x of $('periodPresets').children) x.classList.toggle('on', x === b);
        return;
      }
      state.preset = b.dataset.p;
      applyPreset(); updatePeriodButton(); render(); closePeriod();
    });
    $('calPrev').addEventListener('click', () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } renderCal(); });
    $('calNext').addEventListener('click', () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } renderCal(); });
    $('calGrid').addEventListener('click', e => {
      const b = e.target.closest('button.d'); if (!b || b.disabled) return;
      const d = b.dataset.d;
      if (!pick.from || pick.to) { pick.from = d; pick.to = null; }
      else if (d < pick.from) { pick.to = pick.from; pick.from = d; }
      else pick.to = d;
      for (const x of $('periodPresets').children) x.classList.toggle('on', x.dataset.p === 'custom');
      renderCal();
    });
    $('calApply').addEventListener('click', () => {
      if (!pick.from) return;
      state.preset = 'custom';
      state.from = pick.from; state.to = pick.to || pick.from;
      updatePeriodButton(); render(); closePeriod();
    });
    // composedPath: o clique num dia redesenha o calendário e o botão clicado sai do DOM antes de o evento chegar aqui
    const wrap = document.querySelector('.periodWrap');
    document.addEventListener('click', e => { if (!$('periodPop').hidden && !e.composedPath().includes(wrap)) closePeriod(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('periodPop').hidden) closePeriod(); });
  }

  // ---------- agregação do período: linhas diárias [data, criativo, gasto, impressões, cliques, vendas, faturamento, checkouts] ----------
  function aggregate() {
    const byName = new Map();
    for (const [d, name, spend, impressions, clicks, sales, revenue, checkouts = 0] of ROWS) {
      if (d < state.from || d > state.to) continue;
      const a = byName.get(name) || byName.set(name, { name, ...zero() }).get(name);
      add(a, { spend, impressions, clicks, sales, revenue, checkouts });
    }
    return [...byName.values()].filter(a => a.spend > 0 || a.sales > 0).map(derive);
  }

  // ---------- ordenação ----------
  const ASC_DEFAULT = new Set(['cpa', 'cpc', 'cpm', 'cpi']);
  function sorted(ads) {
    const k = state.sort;
    const asc = state.dir ? state.dir === 'asc' : ASC_DEFAULT.has(k);
    const val = a => k === 'name' ? a.name.toLowerCase() : a[k];
    return ads.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if (!ok(x) && !ok(y) && typeof x !== 'string') return b.sales - a.sales;
      if (typeof x !== 'string' && !ok(x)) return 1;             // sem valor sempre no fim
      if (typeof y !== 'string' && !ok(y)) return -1;
      if (x === y) return b.sales - a.sales || b.spend - a.spend;
      return (x < y ? -1 : 1) * (asc ? 1 : -1);
    });
  }

  // ---------- render ----------
  // seta de link externo (abre o post do anúncio numa aba nova)
  const LINK_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const linkOf = meta => meta && (meta.igUrl || meta.previewUrl);
  const linkHtml = meta => {
    const href = linkOf(meta);
    if (!href) return '';
    return `<a class="plink" href="${esc(href)}" target="_blank" rel="noopener">Ver criativo${LINK_ICON}</a>`;
  };
  const kindLabel = t => t === 'VIDEO' ? 'Vídeo' : t === 'PHOTO' ? 'Imagem' : t === 'SHARE' ? 'Post' : null;

  function cardHtml(a, i) {
    const meta = AD_META.get(a.name) || {};
    const kind = kindLabel(meta.type);
    const img = meta.thumb ? `<img src="${esc(meta.thumb)}" alt="" loading="lazy" decoding="async">` : '<span class="noimg">Sem prévia</span>';
    const play = meta.type === 'VIDEO' && meta.thumb ? '<span class="play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></span>' : '';
    return `<article class="ad">
      <button class="thumb" data-open="${esc(a.name)}" aria-label="Ver prévia de ${esc(a.name)}">${img}${play}<span class="rank">#${i + 1}</span>${kind ? `<span class="kind">${kind}</span>` : ''}</button>
      <div class="ad-body">
        <div class="ad-title"><strong>${esc(a.name)}</strong>${linkHtml(meta)}</div>
        <div class="mets">
          <div class="met"><div class="l">Vendas</div><div class="v num">${fmtInt(a.sales)}</div></div>
          <div class="met"><div class="l">Investimento</div><div class="v num">${fmtMoney0(a.spend)}</div></div>
          <div class="met"><div class="l">CPA</div><div class="v num">${fmtMoney(a.cpa)}</div></div>
          <div class="met"><div class="l">Faturamento</div><div class="v num">${fmtMoney0(a.revenue)}</div></div>
          <div class="met"><div class="l">Lucro</div><div class="v num ${tone(a.profit)}">${fmtMoney0(a.profit)}</div></div>
          <div class="met"><div class="l">ROAS</div><div class="v num ${tone(a.roas, 1)}">${fmtX(a.roas)}</div></div>
        </div>
        <div class="sec num"><span>CPM <b>${fmtMoney(a.cpm)}</b></span><span>CTR <b>${fmtPct(a.ctr)}</b></span><span>CPC <b>${fmtMoney(a.cpc)}</b></span><span title="Custo por finalização de compra iniciada">CPI <b>${fmtMoney(a.cpi)}</b></span></div>
      </div>
    </article>`;
  }

  const COLS = [
    { k: 'name', l: 'Criativo' },
    { k: 'sales', l: 'Vendas', f: fmtInt },
    { k: 'spend', l: 'Investimento', f: fmtMoney },
    { k: 'cpa', l: 'CPA', f: fmtMoney },
    { k: 'revenue', l: 'Faturamento', f: fmtMoney },
    { k: 'profit', l: 'Lucro', f: fmtMoney, t: v => tone(v) },
    { k: 'roas', l: 'ROAS', f: fmtX, t: v => tone(v, 1) },
    { k: 'cpm', l: 'CPM', f: fmtMoney },
    { k: 'ctr', l: 'CTR', f: fmtPct },
    { k: 'cpc', l: 'CPC', f: fmtMoney },
    { k: 'cpi', l: 'CPI', f: fmtMoney },
  ];

  function rowHtml(a) {
    const meta = AD_META.get(a.name) || {};
    const mini = `<button class="mini" data-open="${esc(a.name)}" aria-label="Ver prévia de ${esc(a.name)}">${meta.thumb ? `<img src="${esc(meta.thumb)}" alt="" loading="lazy">` : ''}</button>`;
    return '<tr>' + COLS.map(c => c.k === 'name'
      ? `<td><div class="creative">${mini}<div class="nm"><strong>${esc(a.name)}</strong><small>${linkHtml(meta)}</small></div></div></td>`
      : `<td class="num ${c.t ? c.t(a[c.k]) : ''}">${c.f(a[c.k])}</td>`).join('') + '</tr>';
  }

  function render() {
    const ads = aggregate();
    // lista
    const q = state.q.trim().toLowerCase();
    const list = sorted(ads.filter(a => !q || a.name.toLowerCase().includes(q)));
    document.getElementById('count').textContent = `${list.length} ${list.length === 1 ? 'criativo' : 'criativos'}`;
    document.getElementById('empty').hidden = list.length > 0;
    const cards = state.view === 'cards';
    document.getElementById('grid').hidden = !cards || !list.length;
    document.getElementById('tblWrap').hidden = cards || !list.length;
    if (cards) {
      document.getElementById('grid').innerHTML = list.map(cardHtml).join('');
    } else {
      const dirAttr = c => c.k === state.sort ? ` data-dir="${(state.dir ? state.dir === 'asc' : ASC_DEFAULT.has(c.k)) ? 'asc' : 'desc'}"` : '';
      document.getElementById('thead').innerHTML = COLS.map(c => `<th class="sortable" data-k="${c.k}"${dirAttr(c)}>${c.l}</th>`).join('');
      document.getElementById('tbody').innerHTML = list.map(rowHtml).join('');
      const t = derive(list.reduce((s, a) => add(s, a), zero()));
      document.getElementById('tfoot').innerHTML = '<tr>' + COLS.map(c => c.k === 'name' ? `<td>Total dos criativos listados</td>` : `<td class="num">${c.f(t[c.k])}</td>`).join('') + '</tr>';
    }
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  }

  // ---------- controles ----------
  const sortSel = document.getElementById('sort');
  sortSel.addEventListener('change', () => { state.sort = sortSel.value; state.dir = null; render(); });
  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  document.querySelector('.seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (!b) return;
    state.view = b.dataset.view;
    try { localStorage.setItem('ato-criativos-view', state.view); } catch (err) { /* ok */ }
    render();
  });
  document.getElementById('thead').addEventListener('click', e => {
    const th = e.target.closest('th[data-k]');
    if (!th) return;
    const k = th.dataset.k;
    if (state.sort === k) {
      const asc = state.dir ? state.dir === 'asc' : ASC_DEFAULT.has(k);
      state.dir = asc ? 'desc' : 'asc';
    } else { state.sort = k; state.dir = k === 'name' ? 'asc' : null; }
    if ([...sortSel.options].some(o => o.value === k)) sortSel.value = k;
    render();
  });

  // ---------- prévia ----------
  const dlg = document.getElementById('dlg');
  function igEmbed(url) {
    const m = String(url || '').match(/instagram\.com\/(p|reel|tv)\/([^/?#]+)/);
    return m ? `https://www.instagram.com/${m[1]}/${m[2]}/embed/` : null;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-open]');
    if (!b) return;
    const meta = AD_META.get(b.dataset.open) || {};
    document.getElementById('dlgTitle').textContent = b.dataset.open;
    const link = document.getElementById('dlgLink');
    const href = linkOf(meta);
    link.hidden = !href;
    if (href) { link.href = href; link.innerHTML = 'Abrir em nova aba' + LINK_ICON; }
    const embed = igEmbed(meta.igUrl);
    document.getElementById('dlgBody').innerHTML = embed
      ? `<iframe src="${esc(embed)}" title="Prévia do criativo" loading="lazy" allowfullscreen></iframe>`
      : meta.thumb ? `<img src="${esc(meta.thumb)}" alt="">` : '<div class="empty">Sem prévia disponível.</div>';
    dlg.showModal();
  });
  const closeDlg = () => { dlg.close(); document.getElementById('dlgBody').innerHTML = ''; };
  document.getElementById('dlgClose').addEventListener('click', closeDlg);
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
  dlg.addEventListener('close', () => { document.getElementById('dlgBody').innerHTML = ''; });

  // ---------- rodapé ----------
  const upd = D.summary && D.summary.updatedAt ? new Date(D.summary.updatedAt) : null;
  const updTxt = upd ? upd.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : null;
  document.getElementById('foot').textContent = 'Vendas da Hotmart ligadas ao anúncio pelo ID; investimento, impressões e cliques do Meta Ads'
    + (SALES_UNTIL ? ` · vendas importadas até ${fmtDate(SALES_UNTIL)}` : '') + (updTxt ? ` · Meta atualizado em ${updTxt}` : '') + '.';

  applyPreset();
  initPeriodPicker();
  updatePeriodButton();
  render();
})();
</script>
</body>
</html>
